name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check version and pack
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun install --frozen-lockfile
          expected=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$expected" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $expected"
            exit 1
          fi
          npm pack
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$RELEASE_TAG" in *-*) flags="--prerelease" ;; esac
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" opencode-game-prototype-*.tgz install-game-prototype.ps1 --clobber
          else
            gh release create "$RELEASE_TAG" opencode-game-prototype-*.tgz install-game-prototype.ps1 --title "$RELEASE_TAG" --generate-notes $flags
          fi
